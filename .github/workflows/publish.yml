# Generated by @glastor-dev/samurai - GitHub 2026 Standards
name: Publish to JSR

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish Package to JSR (OIDC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Deno Environment
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify Types & Test Suite
        run: |
          deno check src/mod.ts src/cli.ts
          deno test -A

      - name: Publish to JSR
        run: deno publish
