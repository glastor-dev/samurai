# Generated by @glastor-dev/samurai - GitHub 2026 Standards
name: Publish to JSR

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulate publication without writing to JSR registry"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish Package to JSR (OIDC)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Deno Environment
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify Code Quality & Testing
        run: |
          deno fmt --check
          deno lint
          deno check src/mod.ts src/cli.ts
          deno test -A

      - name: Publish to JSR
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Running simulated JSR publication..."
            deno publish --dry-run --allow-slow-types
          else
            echo "Publishing @glastor-dev/samurai with OIDC..."
            deno publish --allow-slow-types
          fi
