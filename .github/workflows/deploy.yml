# Generated by @glastor-dev/samurai - GitHub 2026 Standards
name: Deploy to Deno Deploy

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy Edge Application
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Deno Environment
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify Code Quality & Testing
        run: |
          deno fmt --check
          deno lint
          deno check src/mod.ts src/cli.ts src/server.ts
          deno test -A

      - name: Deploy to Deno Deploy
        uses: denoland/deployctl@v1
        with:
          project: ${{ vars.DENO_DEPLOY_PROJECT || 'samurai' }}
          entrypoint: "src/server.ts"
